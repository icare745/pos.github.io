<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PawPOS">
<title>PawPOS 寵物店管理系統 Pro</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0e18;--bg2:#141720;--bg3:#1e2133;--bg4:#272b40;
  --acc:#6c63ff;--acc2:#9b94ff;--acc3:#4a42cc;
  --text:#eceaff;--text2:#9390bf;--text3:#5e5c85;
  --border:#2e3150;--border2:#404468;
  --green:#3ddc84;--red:#ff6b6b;--amber:#ffb830;--blue:#5aa9ff;--teal:#29d9c2;
  font-family:'Noto Sans HK',system-ui,sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{display:flex;flex-direction:column}
.app-shell{display:flex;flex-direction:column;height:100%;height:100dvh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:calc(var(--safe-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:52px}
.topbar .tb-left{display:flex;align-items:center;gap:10px}
.topbar .page-title{font-size:16px;font-weight:700;color:var(--text)}
.topbar .tb-right{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--acc3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 12px calc(var(--safe-bottom) + 70px)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;padding-bottom:var(--safe-bottom);background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:90;flex-shrink:0}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;color:var(--text3);font-size:10px;gap:3px;transition:color 0.15s;min-width:0}
.bn-item .bni{font-size:20px;line-height:1}
.bn-item.active{color:var(--acc2)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
input,select,textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;outline:none}
.btn{padding:12px 18px;border-radius:12px;border:none;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--acc);color:#fff}
.btn-success{background:#1a4d2e;color:var(--green)}
.btn-danger{background:#4d1a1a;color:var(--red)}
.btn-full{width:100%}
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:260px;overflow-y:auto}
.prod-btn{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;color:var(--text)}
.cart-item{display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg3);border-radius:10px;margin-bottom:6px}
#scanner{width:100%;height:180px;background:#000;border-radius:12px;overflow:hidden;margin-bottom:12px;display:none}
#scanner video{width:100%;height:100%;object-fit:cover}
.hidden{display:none!important}
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:flex-end;justify-content:center;padding-bottom:var(--safe-bottom);z-index:1000}
.login-sheet{background:var(--bg2);border-radius:24px 24px 0 0;padding:28px 24px 32px;width:100%;border-top:1px solid var(--border)}
.u-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.u-card{background:var(--bg3);border:2px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center}
.u-card.sel{border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text3)}
td{padding:10px 10px;border-bottom:1px solid var(--border)22;color:var(--text2)}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-sheet">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:48px">🐾</div>
      <div style="font-size:22px;font-weight:700;color:var(--acc2)">PawPOS</div>
    </div>
    <div class="u-cards" id="uCards"></div>
    <input type="password" id="loginPwd" placeholder="輸入密碼..." style="margin-bottom:10px">
    <button class="btn btn-primary btn-full" onclick="doLogin()">登入</button>
  </div>
</div>

<div class="app-shell hidden" id="mainApp">
  <div class="topbar">
    <div class="tb-left"><span style="font-size:20px">🐾</span><div class="page-title" id="pageTitle">交易</div></div>
    <div class="tb-right"><div class="avatar" id="topAvatar">A</div><div style="font-size:12px" id="topUser"></div></div>
  </div>
  <div class="content" id="mainContent"></div>
  <div class="bottom-nav" id="bottomNav"></div>
</div>

<script>
// --- 資料結構 (初始化) ---
let D = JSON.parse(localStorage.getItem('PawPOS_Data')) || {
  users:[
    {id:1,name:'陳店長',role:'管理員',pwd:'1234',color:'#6c63ff'},
    {id:2,name:'李美容師',role:'美容師',pwd:'2222',color:'#29d9c2'},
    {id:3,name:'王收銀員',role:'收銀員',pwd:'3333',color:'#ff6b9d'}
  ],
  payMethods:['現金','PayMe','轉數快','套票'],
  categories:['食品','零食','護理','清潔','服務'],
  products:[
    {id:'P001',name:'狗糧 Hill\'s 7kg',cat:'食品',price:280,stock:45,code:''},
    {id:'P002',name:'貓糧 Royal Canin',cat:'食品',price:320,stock:30,code:''},
    {id:'SRV001',name:'沖涼服務',cat:'服務',price:180,stock:999,code:''}
  ],
  customers:[
    {id:'C001',name:'張小明',phone:'91234567',ticket:{balance:500}}
  ],
  transactions:[],
  appointments:[],
  cart:[],
  selPay:'現金',
  currentUser:null
};

function save() { localStorage.setItem('PawPOS_Data', JSON.stringify(D)); }

// --- 登入邏輯 ---
let selUid = null;
(function initLogin(){
  const uc = document.getElementById('uCards');
  D.users.forEach(u => {
    uc.innerHTML += `<div class="u-card" id="ub${u.id}" onclick="selUser(${u.id})">
      <div style="color:${u.color};font-size:18px;font-weight:700">${u.name[0]}</div>
      <div style="font-size:12px">${u.name}</div></div>`;
  });
})();

function selUser(id){
  selUid=id; 
  document.querySelectorAll('.u-card').forEach(e=>e.classList.remove('sel'));
  document.getElementById('ub'+id).classList.add('sel');
}

function doLogin(){
  if(!selUid) return;
  const u = D.users.find(x=>x.id===selUid);
  if(document.getElementById('loginPwd').value !== u.pwd) return alert("密碼錯誤");
  D.currentUser = u;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('topUser').textContent = u.name;
  document.getElementById('topAvatar').textContent = u.name[0];
  buildBottomNav(); nav('pos');
}

// --- 導航 ---
