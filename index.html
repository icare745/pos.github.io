<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PawPOS 完整升級版</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
<style>
/* 這裡完全保留你原本的深藍色主題樣式 */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0e18;--bg2:#141720;--bg3:#1e2133;--bg4:#272b40;
  --acc:#6c63ff;--acc2:#9b94ff;--acc3:#4a42cc;
  --text:#eceaff;--text2:#9390bf;--text3:#5e5c85;
  --border:#2e3150;--border2:#404468;
  --green:#3ddc84;--red:#ff6b6b;
}
body{font-family:'Noto Sans HK',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
.header{padding:15px;background:var(--bg2);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.main{flex:1;overflow-y:auto;padding:15px;padding-bottom:100px}
.nav{position:fixed;bottom:0;width:100%;background:var(--bg2);display:flex;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;padding:15px;text-align:center;color:var(--text2);font-size:12px}
.nav-item.active{color:var(--acc);font-weight:600}
.btn{padding:12px;border:none;border-radius:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--acc);color:#fff}
.btn-full{width:100%;margin-bottom:10px;font-size:14px}
.card{background:var(--bg2);border-radius:16px;padding:15px;margin-bottom:15px;border:1px solid var(--border)}
.product-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg3);border-radius:12px;margin-bottom:8px}
input,select{width:100%;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg4);color:#fff}
#scanner{width:100%;height:200px;background:#000;border-radius:12px;overflow:hidden;margin-bottom:15px;display:none}
#scanner video{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;padding:6px 12px;background:var(--bg4);border-radius:20px;font-size:12px;margin:4px;border:1px solid var(--border2)}
</style>
</head>
<body>

<div class="header">
    <h2 id="pageTitle">PawPOS</h2>
    <div onclick="switchTab('cart')" style="cursor:pointer">🛒 <span id="cartCount">0</span></div>
</div>

<div class="main" id="app"></div>

<div class="nav">
    <div class="nav-item active" onclick="switchTab('pos')">🏠 銷售</div>
    <div class="nav-item" onclick="switchTab('history')">📜 紀錄</div>
    <div class="nav-item" onclick="switchTab('admin')">⚙️ 管理</div>
</div>

<script>
// ─── 核心資料 (確保讀取舊資料) ───
let D = JSON.parse(localStorage.getItem('PawPOS_Data')) || {
    products: [], sales: [], categories: ['預設'], payMethods: ['現金', 'PayMe', '轉數快'], cart: []
};
// 補齊可能缺失的欄位
if(!D.cart) D.cart = [];
if(!D.categories) D.categories = ['預設'];
if(!D.payMethods) D.payMethods = ['現金', 'PayMe', '轉數快'];

function save() { localStorage.setItem('PawPOS_Data', JSON.stringify(D)); }

let currentTab = 'pos';

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-item').forEach((el, i) => {
        el.classList.toggle('active', ['pos','history','admin'][i] === tab);
    });
    if(scanning) stopScanner();
    render();
}

function render() {
    const app = document.getElementById('app');
    document.getElementById('cartCount').innerText = D.cart.length;
    if (currentTab === 'pos') renderPOS(app);
    else if (currentTab === 'history') renderHistory(app);
    else if (currentTab === 'admin') renderAdmin(app);
}

// ─── 銷售功能 ───
function renderPOS(el) {
    el.innerHTML = `
        <div id="scanner"></div>
        <button class="btn btn-primary btn-full" onclick="toggleScanner()">📷 點擊掃描條碼</button>
        <input type="text" id="search" placeholder="搜尋產品名稱或掃描條碼..." oninput="renderProductList()">
        <div id="productList"></div>
    `;
    renderProductList();
}

function renderProductList() {
    const q = document.getElementById('search').value.toLowerCase();
    const list = document.getElementById('productList');
    const filtered = D.products.filter(p => p.name.toLowerCase().includes(q) || (p.code && p.code.includes(q)));
    list.innerHTML = filtered.map(p => `
        <div class="product-item" onclick="addToCart('${p.id}')">
            <div><strong>${p.name}</strong><br><small>$${p.price} | 庫存:${p.stock}</small></div>
            <div style="color:var(--acc);font-size:20px">＋</div>
        </div>
    `).join('');
}

function addToCart(id) {
    const p = D.products.find(x => x.id === id);
    if(p.stock <= 0) { alert("此產品已無庫存"); return; }
    D.cart.push({...p});
    save();
    render();
}

// ─── 掃描邏輯 ───
let scanning = false;
function toggleScanner() {
    if(!scanning) startScanner(); else stopScanner();
}
function startScanner() {
    const s = document.getElementById('scanner');
    s.style.display = 'block';
    Quagga.init({
        inputStream: { name: "Live", type: "LiveStream", target: s, constraints: { facingMode: "environment" } },
        decoder: { readers: ["ean_reader", "code_128_reader", "upc_reader"] },
        locate: true
    }, (err) => {
        if(err) { alert("相機開啟失敗"); return; }
        Quagga.start();
        scanning = true;
    });
    Quagga.onDetected(res => {
        document.getElementById('search').value = res.codeResult.code;
        stopScanner();
        renderProductList();
    });
}
function stopScanner() {
    Quagga.stop();
    document.getElementById('scanner').style.display = 'none';
    scanning = false;
}

// ─── 紀錄與 Excel ───
function renderHistory(el) {
    el.innerHTML = `
        <button class="btn btn-primary btn-full" onclick="exportToExcel()" style="background:var(--green);color:#000;margin-bottom:20px">📊 匯出 Excel 報表 (庫存+銷售)</button>
        <h3>最近銷售紀錄</h3><br>
        ${D.sales.slice().reverse().map(s => `
            <div class="card">
                <div style="display:flex;justify-content:space-between"><strong>${s.date}</strong><b style="color:var(--green)">$${s.total}</b></div>
                <small>${s.items.map(i => i.name).join(', ')}</small><br>
                <small>支付方式: ${s.payBy}</small>
            </div>
        `).join('')}
    `;
}

function exportToExcel() {
    if(D.sales.length === 0 && D.products.length === 0) return alert("無資料可匯出");
    const ws1 = XLSX.utils.json_to_sheet(D.products);
    const ws2 = XLSX.utils.json_to_sheet(D.sales.map(s => ({
        日期: s.date, 總額: s.total, 項目: s.items.map(i=>i.name).join(','), 支付方式: s.payBy
    })));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws1, "產品庫存");
    XLSX.utils.book_append_sheet(wb, ws2, "銷售紀錄");
    XLSX.writeFile(wb, `PawPOS_Report_${new Date().toLocaleDateString()}.xlsx`);
}

// ─── 管理功能 (保留舊版所有功能) ───
function renderAdmin(el) {
    el.innerHTML = `
        <div class="card">
            <h3>🆕 新增產品</h3>
            <input id="p_name" placeholder="產品名稱">
            <input id="p_price" type="number" placeholder="售價">
            <input id="p_stock" type="number" placeholder="庫存">
            <input id="p_code" placeholder="條碼 (掃描後自動填入)">
            <button class="btn btn-primary btn-full" onclick="addProduct()">儲存產品</button>
        </div>
        <div class="card">
            <h3>📦 產品管理 (點擊📝修改)</h3><br>
            ${D.products.map(p => `
                <div class="product-item">
                    <div><strong>${p.name}</strong><br><small>$${p.price} | 庫存:${p.stock}</small></div>
                    <button class="btn" onclick="editProduct('${p.id}')" style="background:var(--bg4);padding:6px;font-size:12px">📝編輯</button>
                </div>
            `).join('')}
        </div>
        <div class="card">
            <h3>⚙️ 系統設定</h3>
            <button class="btn btn-full" onclick="exportJSON()">📤 匯出資料備份 (JSON)</button>
            <button class="btn btn-full" onclick="location.reload()" style="background:var(--red)">🔒 登出系統 / 重新整理</button>
        </div>
    `;
}

function addProduct() {
    const n = document.getElementById('p_name').value;
    const p = document.getElementById('p_price').value;
    const s = document.getElementById('p_stock').value;
    const c = document.getElementById('p_code').value;
    if(!n || !p) return alert("請輸入名稱及價格");
    D.products.push({ id: Date.now().toString(), name: n, price: parseFloat(p), stock: parseInt(s)||0, code: c });
    save(); render();
}

function editProduct(id) {
    const p = D.products.find(x => x.id === id);
    const newName = prompt("產品名稱:", p.name);
    if (newName === null) return;
    const newPrice = prompt("售價:", p.price);
    const newStock = prompt("庫存:", p.stock);
    const newCode = prompt("條碼:", p.code || "");
    
    p.name = newName;
    p.price = parseFloat(newPrice) || 0;
    p.stock = parseInt(newStock) || 0;
    p.code = newCode;
    save(); render();
}

function exportJSON() {
    const blob = new Blob([JSON.stringify(D)], {type:"application/json"});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "PawPOS_Backup.json";
    a.click();
}

render();
</script>
</body>
</html>
